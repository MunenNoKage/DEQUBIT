# Every path, hyperparameter, and the seed. Nothing in src/ should hardcode a value
# that an experiment might want to vary.
#
# Add sections as the project needs them.

seed: 42

paths:
  # Files of data2/generation.py with the noisy shots, P_target, the circuit metadata
  # and the device calibration. {split} is replaced by train, val or test and
  # {num_qubits} by every number of data.qubit_counts.
  data: data_v4/noisy_{split}_N{num_qubits}.h5
  model: models/
  # {split} is replaced by validation or test.
  metrics: results/metrics_{split}.json
  figures_dir: results/figures
  # Metrics and figures of every ablation variant go to a folder of its name here.
  ablations: results/ablations
  # Clifford circuits of data2/clifford_generation.py, evaluated by
  # python -m dequbit evaluate-clifford.
  clifford_data: data_clifford/clifford_{split}_N{num_qubits}.h5
  clifford_metrics: results/metrics_clifford_{split}.json

data:
  # Numbers of qubits of the circuits used, each with its own files. The shared scorer
  # is trained on all of them together, every other model once per number.
  qubit_counts: [3, 5, 6, 8, 9, 11]
  # Shots of one circuit corrected together and averaged into one distribution; the
  # files hold 92160.
  shots_per_circuit: 92160
  # Circuit families left out of training and validation, to test the models on
  # families they never saw: any of qft, phase_estimation, hlf, bv, iqp.
  excluded_types: []
  # Numbers of qubits whose training and validation circuits also include the Clifford
  # circuits of paths.clifford_data (one or two correct outputs); small sizes only,
  # since they are read into 2**num_qubits vectors.
  clifford_qubit_counts: []

actions:
  # Largest number of bits one action flips: 1 gives single flips, 2 adds pair flips.
  radius: 2

model:
  # One of: mlp, shared_scorer, per_qubit.
  name: mlp
  mlp:
    hidden_sizes: [128, 128]
    # Inputs besides the bits; false only in ablations.
    use_local_counts: true
    use_context: true
    # Gate infidelity and readout errors of every bit, from the decoded circuit.
    use_circuit_context: true
  shared_scorer:
    hidden_sizes: [64, 64]
    # Gate infidelity, readout error and direction of the flipped bits, and the gate
    # noise of the circuit, from the decoded circuit.
    use_circuit_context: true
    # Mean counts of the neighbours at distance 1 and 2 of the destination, relative to
    # those of the bitstring.
    use_neighbourhood: false

training:
  # auto trains on the GPU when one is available, otherwise on the CPU; cpu or cuda
  # choose one. Results on the two differ in the last digits.
  device: auto
  # Upper limit of optimizer steps; early stopping usually ends training sooner.
  max_steps: 30000
  circuits_per_batch: 128
  # Upper limit of (bitstring, action) pairs in one batch, which bounds the memory:
  # circuits with many qubits get batches of fewer circuits.
  max_pairs_per_batch: 1000000
  learning_rate: 1.0e-3
  # Lower the learning rate to 0 along a half cosine over max_steps.
  cosine_decay: false
  weight_decay: 1.0e-4
  # Validation loss and median L1 relative change every this many steps.
  validation_interval: 200
  # Stop when the validation loss has not improved for this many validations.
  early_stopping_patience: 16
  # Weight of the expected flipped bits per shot in the loss; 0 turns it off.
  flip_penalty: 0.0
  # Divide the KL of every circuit by KL(P_target || noisy) to weigh circuits equally.
  relative_loss: false
  # Every training batch keeps a random share of the shots of its circuits, from this
  # many shots to all of them, so one model learns every number of shots in between;
  # null keeps all shots.
  min_shots: null

baselines:
  # Thresholds tried on the training circuits: threshold_steps values from 0 to
  # threshold_max, as in Placidi et al.
  threshold_max: 0.5
  threshold_steps: 30
  # Depolarising rates tried on the training circuits: rate_steps values from 0 to
  # rate_max.
  rate_max: 0.95
  rate_steps: 100
  # Factors of the physical depolarising rate tried for fitted physical MIX:
  # scale_steps values from 0 to scale_max.
  scale_max: 3.0
  scale_steps: 61

evaluation:
  # Circuits to evaluate: validation while developing, test only for final results.
  split: validation
  # Numbers of qubits evaluated. Numbers outside data.qubit_counts were not trained on:
  # there the shared scorer corrects circuits larger than any it has seen.
  qubit_counts: [3, 5, 6, 8, 9, 11, 12, 13]
  # Numbers of qubits of the Clifford circuits, far beyond the trained sizes.
  clifford_qubit_counts: [11, 13, 16, 20, 24, 32, 40, 48, 56, 63, 80, 100, 112]
  # Every model and seed needs a model file from python -m dequbit train.
  models: [mlp, shared_scorer]
  seeds: [0, 1, 2, 3, 4]
  # Inference mode of the reported numbers: expected, sample or argmax.
  inference: sample
  # Bootstrap samples and coverage of the confidence intervals of the medians and of
  # the paired comparisons of every model with the best baseline.
  bootstrap_resamples: 2000
  confidence_level: 0.95
  # Drift of the calibration the corrections are given for the evaluated circuits:
  # standard deviation of the log of a random factor on every error rate. 0 is the true
  # calibration, 0.2 changes a rate by about 20 percent.
  calibration_noise: 0.0

ablation:
  # Training seeds of the variants that train their own models.
  seeds: [0, 1, 2]
  # python -m dequbit ablate NAME applies the overrides of variant NAME, in the
  # KEY=VALUE form of --set. With train true the variant trains its own models,
  # otherwise it evaluates the main models.
  variants:
    no_circuit_context:
      train: true
      overrides:
        - model.mlp.use_circuit_context=false
        - model.shared_scorer.use_circuit_context=false
    with_neighbourhood:
      train: true
      overrides:
        - model.shared_scorer.use_neighbourhood=true
        - evaluation.seeds=[0, 1, 2, 3, 4]
        - evaluation.models=[shared_scorer]
    with_neighbourhood_and_thinned_shots:
      train: true
      overrides:
        - model.shared_scorer.use_neighbourhood=true
        - training.min_shots=1024
        - evaluation.seeds=[0, 1, 2, 3, 4]
        - evaluation.models=[shared_scorer]
    with_clifford_training:
      train: true
      overrides:
        - data.clifford_qubit_counts=[5, 8, 11]
        - evaluation.models=[shared_scorer]
    trained_on_3_to_8_qubits:
      train: true
      overrides:
        - data.qubit_counts=[3, 5, 6, 8]
        - evaluation.models=[shared_scorer]
    without_qft:
      train: true
      overrides:
        - data.excluded_types=[qft]
        - evaluation.models=[shared_scorer]
        - evaluation.seeds=[0, 1]
    without_hlf:
      train: true
      overrides:
        - data.excluded_types=[hlf]
        - evaluation.models=[shared_scorer]
        - evaluation.seeds=[0, 1]
    without_bv:
      train: true
      overrides:
        - data.excluded_types=[bv]
        - evaluation.models=[shared_scorer]
        - evaluation.seeds=[0, 1]
    without_iqp:
      train: true
      overrides:
        - data.excluded_types=[iqp]
        - evaluation.models=[shared_scorer]
        - evaluation.seeds=[0, 1]
    shots_1024:
      train: false
      overrides: [data.shots_per_circuit=1024]
    shots_8192:
      train: false
      overrides: [data.shots_per_circuit=8192]
    trained_on_thinned_shots:
      train: true
      overrides:
        - training.min_shots=1024
        - evaluation.models=[shared_scorer]
        - evaluation.seeds=[0, 1]
    trained_on_1024_shots:
      train: true
      overrides:
        - data.shots_per_circuit=1024
        - evaluation.models=[shared_scorer]
        - evaluation.seeds=[0, 1]
    expected_inference:
      train: false
      overrides: [evaluation.inference=expected]
    calibration_noise_20:
      train: false
      overrides: [evaluation.calibration_noise=0.2]
    calibration_noise_50:
      train: false
      overrides: [evaluation.calibration_noise=0.5]

logging:
  level: INFO

# Every path, hyperparameter, and the seed. Nothing in src/ should hardcode a value
# that an experiment might want to vary.
#
# Add sections as the project needs them.

seed: 42

paths:
  # Circuit i is the same circuit in a clean file and in the matching noisy file.
  clean_train: data/1_clean_train.h5
  clean_test: data/2_clean_test.h5
  noisy_train: data/3_noisy_train.h5
  noisy_test: data/4_noisy_test.h5
  model: models/
  # {split} is replaced by validation or test.
  metrics: results/metrics_{split}.json
  figures_dir: results/figures

data:
  num_qubits: 5
  # Share of the training circuits held out for validation.
  validation_fraction: 0.2
  # Shots of one circuit corrected together and averaged into one distribution.
  shots_per_circuit: 10000

actions:
  # Largest number of bits one action flips: 1 gives single flips, 2 adds pair flips.
  radius: 2

model:
  # One of: mlp, shared_scorer, per_qubit.
  name: mlp
  mlp:
    hidden_sizes: [128, 128]
  shared_scorer:
    hidden_sizes: [64, 64]

training:
  # Upper limit of optimizer steps; early stopping usually ends training sooner.
  max_steps: 10000
  circuits_per_batch: 128
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  # Validation loss and median L1 relative change every this many steps.
  validation_interval: 200
  # Stop when the validation loss has not improved for this many validations.
  early_stopping_patience: 8
  # Weight of the expected flipped bits per shot in the loss; 0 turns it off.
  flip_penalty: 0.0
  # Divide the KL of every circuit by KL(P_target || noisy) to weigh circuits equally.
  relative_loss: false

baselines:
  # Thresholds tried on the training circuits: threshold_steps values from 0 to
  # threshold_max, as in Placidi et al.
  threshold_max: 0.5
  threshold_steps: 30
  # Depolarising rates tried on the training circuits: rate_steps values from 0 to
  # rate_max.
  rate_max: 0.95
  rate_steps: 100

evaluation:
  # Circuits to evaluate: validation while developing, test only for final results.
  split: validation
  # Every model and seed needs a model file from python -m dequbit train.
  models: [mlp, shared_scorer, per_qubit]
  seeds: [0, 1, 2, 3, 4]
  # Inference mode of the reported numbers: expected, sample or argmax.
  inference: sample

logging:
  level: INFO

# Every path, hyperparameter, and the seed. Nothing in src/ should hardcode a value
# that an experiment might want to vary.
#
# Add sections as the project needs them.

seed: 42

paths:
  # Circuit i is the same circuit in a clean file and in the matching noisy file.
  clean_train: data/1_clean_train.h5
  clean_test: data/2_clean_test.h5
  noisy_train: data/3_noisy_train.h5
  noisy_test: data/4_noisy_test.h5
  model: models/
  metrics: results/metrics.json
  figures_dir: results/figures

data:
  num_qubits: 5
  # Share of the training circuits held out for validation.
  validation_fraction: 0.2
  # Shots of one circuit corrected together and averaged into one distribution.
  shots_per_circuit: 10000

model:
  # One of: mlp, transformer, perceiver, per_qubit.
  name: mlp
  mlp:
    # TODO: hidden layer sizes, dropout.
  transformer:
    # TODO: embedding size, heads, layers, dropout.
  perceiver:
    # TODO: latent size, number of latents, layers, dropout.

training:
  epochs: # TODO
  circuits_per_batch: # TODO
  learning_rate: # TODO
  weight_decay: # TODO
  # Stop when the validation loss has not improved for this many epochs.
  early_stopping_patience: # TODO

baselines:
  # Probabilities below this value are set to zero before renormalising.
  threshold: # TODO

logging:
  level: INFO
